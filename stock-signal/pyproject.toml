[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gpt-astra-stock-signal"
version = "0.1.0"
description = "SET daily signal research and conservative paper backtesting"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==8.3.5"]

[project.scripts]
stock-signal = "stock_signal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_signal"]
